name: parallel-security-scans-v2

on:
  workflow_dispatch:

jobs:
    sonar:
      name: SonarQube Cloud Scan
      runs-on: ubuntu-latest
      
      outputs:
        scan_status: ${{ steps.sonar_outputs.outputs.scan_status }}
        quality_gate: ${{ steps.sonar_outputs.outputs.quality_gate }}
        artifact_name: sonar-reports


      steps:  
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          
      - name: Run SonarQube scan
        id: sonar_scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.POC_SONAR_TOKEN }}
          
      - name: Create Sonar report directory
        if: always()
        run: mkdir -p reports/sonar

      - name: Verify current workspace
        run: |
          cat /etc/os-release
          pwd
          ls -la

      - name: Preserve Sonar task metadata
        if: always()
        run: |
          if [ -f .scannerwork/report-task.txt ]; then
            echo "inside .scannerwork"
            cp .scannerwork/report-task.txt reports/sonar/report-task.txt
            echo "report-task.txt is "
            cat reports/sonar/report-task.txt
          fi

      - name: Obtain Sonar quality gate
        id: sonar_api
        if: always()
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.POC_SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.POC_SONAR_PROJECT_JUICE_SHOP_KEY }}
        run: |
          curl --silent \
            --show-error \
            --fail-with-body \
            --header "Authorization: Bearer ${SONAR_TOKEN}" \
            --get \
            --data-urlencode "projectKey=${SONAR_PROJECT_KEY}" \
            "https://sonarcloud.io/api/qualitygates/project_status" \
            --output reports/sonar/quality-gate.json

      - name: Show quality gatefile
        if: always()
        run: |
          echo "#######################################################"
          cat ./reports/sonar/quality-gate.json | jq
          echo "#######################################################"

      - name: Obtain first page of Sonar Issues
        if: always()
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.POC_SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.POC_SONAR_PROJECT_JUICE_SHOP_KEY }}
        run: |
          curl --silent \
            --show-error \
            --fail-with-body \
            --header "Authorization: Bearer ${SONAR_TOKEN}" \
            --get \
            --data-urlencode "componentKeys=${SONAR_PROJECT_KEY}" \
            --data-urlencode "ps=500" \
            "https://sonarcloud.io/api/issues/search" \
            --output reports/sonar/issues-page-1.json  

      - name: Create Sonar outputs
        id: sonar_output  
        if: always()
        env:
          SCAN_STATUS: ${{ steps.sonar_scan.outcome }} 
        run: |
          quality_gate="UNKNOWN"
          
          if [ -f reports/sonar/quality-gate.json ]; then
            quality_gate="$(
              jq -r '.projectStatus.status // "UNKNOWN"' \
                reports/sonar/quality-gate.json 
            )"
          fi

          echo "scan_status=${SCAN_STATUS}" >> "$GITHUB_OUTPUT"
          echo "quality_gate=${quality_gate}" >> "$GITHUB_OUTPUT"

          {
            echo "## SonarQube"
            echo "- Scan: ${SCAN_STATUS}"
            echo "- Quality Gate: ${quality_gate}"
          } >> "$GITHUB_STEP_SUMMARY"

      
      - name: Upload Sonar reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-reports
          path: reports/sonar
          if-no-files-found: warn
          retention-days: 15

    snyk:
      name: Snyk Open Source Scan
      runs-on: ubuntu-latest 
      
      outputs:
        scan_exit_code: ${{ steps.snyk_scan.outputs.exit_code }}
        vulnerabilities: ${{ steps.snyk_outputs.outputs.vulnerabilities }}
        artifact_name: snyk-reports 

      steps:  
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          
      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install project dependencies
        run: npm install --ignore-scripts

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master
        
      - name: Create Snyk report directory
        run: mkdir -p reports/snyk
        
      - name: Run Snyk Open Source scan
        id: snyk_scan
        env:
          SNYK_TOKEN: ${{ secrets.POC_SNYK_TOKEN }}
        run: |
          set +e
          
          snyk test \
            --file=package.json \
            --package-manager=npm \
            --json-file-output=reports/snyk/snyk-results.json \
            --sarif-file-output=reports/snyk/snyk-results/sarif

          exit_code=$?
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Show snyk report
        if: always()
        run: |
          if [ -f reports/snyk/snyk-results.json ]; then
            cat reports/snyk/snyk-results.json | jq
          fi  
             
      
            
      - name: Create Snyk outputs
        id: snyk_outputs
        if: always()
        env:
          SNYK_EXIT_CODE: ${{ steps.snyk_scan.outputs.exit_code }}
        run: |
          set -e

          vulnerabilities=0

          if [ -f reports/snyk/snyk-results.json ]; then
            vulnerabilities="$(
              jq '
                if type == "array" then
                  map((.vulnerabilities // [] ) |  length) | add  // 0 
                else
                  (.vulnerabilities // []) | length 
                end
              ' reports/snyk/snyk-results.json
            )"
          fi
          
          echo "vulnerabilities=${vulnerabilities}" >> "$GITHUB_OUTPUT"

          {
            echo "### Snyk Open Source"
            echo "- Exit code: ${SNYK_EXIT_CODE:-UNKNOWN}"
            echo "- Vulnerabilities: ${vulnerabilities}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish snapshot to Snyk Portal
        id: snyk_monitor
        if: github.ref == 'refs/heads/main'
        env:
          SNYK_TOKEN: ${{ secrets.POC_SNYK_TOKEN }}
          SNYK_ORG_ID: ${{ secrets.POC_SNYK_ORG_ID }} 
        run: |
          snyk monitor \
            --file=package.json \
            --package-manager=npm \
            --org="$SNYK_ORG_ID" \
            --project-name="${{ github.repository }}" \
            --target-reference="${{ github.ref_name }}" \
            --remote-repo-url="${{ github.server_url }}/${{ github.repository }}"

      - name: Upload Snyk reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-reports
          path: reports/snyk
          if-no-files-found: error
          retention-days: 15

      
    aggregate:
      name: Aggregate scanner results
      runs-on: ubuntu-latest
      needs:
        - sonar
        - snyk
      if: always()
      
      steps:
        - name: Download reports
          uses: actions/download-artifact@v8.0.1
          with:
            pattern: "*-reports"
            path: reports
            merge-multiple: true

        - name: Generate normalized pipeline result
          env:
            SONAR_SCAN_STATUS: ${{  needs.sonar.outputs.scan_status }}
            SONAR_QUALITY_GATE: ${{ needs.sonar.outputs.quality_gate }}
            SNYK_EXIT_CODE: ${{ needs.snyk.outputs.scan_exit_code }}
            SNYK_VULNERABILITIES: ${{ needs.snyk.outputs.vulnerabilities }}
          run: |
            echo "Building generate normalized pipeline results"  
            jq -n \
              --arg repository "${GITHUB_REPOSITORY}" \
              --arg commit "${GITHUB_SHA}" \
              --arg run_id "${GITHUB_RUN_ID}" \
              --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
              --arg sonar_scan_status "${SONAR_SCAN_STATUS:-UNKNOWN}" \
              --arg sonar_quality_gate "${SONAR_QUALITY_GATE}" \
              --arg snyk_exit_code "${SNYK_EXIT_CODE}" \
              --arg snyk_vulnerabilties "${SNYK_VULNERABILITIES}" \
              '{
                 schemaVersion: "1.0",
                 repository:  $repository,
                 commit: $commit,
                 github: {
                    runId: $run_id,
                    runAttempt: $run_attempt 
                 },
                 scanners: {
                    sonar: {
                        scanStatus: $sonar_scan_status,
                        qualityGate: $sonar_quality_gate
                    },
                    snyk: {
                        exitCode: $snyk_exit_code,
                        vulnerabilties:
                          ($snyk_vulnerabilties | tonumber )
                    } 
                 } 
              }' > reports/pipeline-security-summary.json

              jq . reports/pipeline-security-summary.json


        - name: Upload consolidated reports
          uses: actions/upload-artifact@v4
          with:
            name: consolidated-security-reports
            path: reports
            retention-days: 30

